<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>游慧珍｜名片</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@500;600&display=swap">
<style>
:root{--green:#0d3b2c;--green2:#082a1f;--gold:#d4af37;--gold2:#f1d98a;--ivory:#f5ecd2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#05140e;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;color:var(--ivory)}
.card{width:min(100%,760px);aspect-ratio:7/4;position:relative;display:grid;grid-template-columns:36% 1fr;gap:4%;padding:5.5% 5.5% 5.5% 5%;
background:radial-gradient(120% 120% at 20% 0%,#16543f 0%,var(--green) 45%,var(--green2) 100%);
border:2px solid var(--gold);border-radius:14px;box-shadow:0 0 0 6px var(--green2),0 0 0 7.5px var(--gold),0 24px 50px rgba(0,0,0,.55);container-type:inline-size}
.card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(212,175,55,.55);border-radius:8px;pointer-events:none}
.photo{align-self:center;aspect-ratio:5/6.4;border-radius:999px 999px 14px 14px;border:2px solid var(--gold);padding:4px;background:linear-gradient(160deg,var(--gold2),var(--gold) 50%,#8a6b17)}
.cafe{position:relative;width:100%;height:100%;border-radius:inherit;overflow:hidden;
background:
radial-gradient(circle at 18% 22%,rgba(255,196,110,.95) 0 9%,transparent 10%),
radial-gradient(circle at 78% 16%,rgba(255,226,160,.9) 0 7%,transparent 8%),
radial-gradient(circle at 88% 46%,rgba(255,170,90,.85) 0 8%,transparent 9%),
radial-gradient(circle at 10% 60%,rgba(255,214,140,.8) 0 6%,transparent 7%),
radial-gradient(circle at 50% 8%,rgba(255,240,200,.9) 0 5%,transparent 6%),
linear-gradient(180deg,#b27a45,#7b4a26 60%,#4b2c16)}
.cafe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;mix-blend-mode:multiply;filter:saturate(1.05)}
.cafe::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 55%,rgba(40,20,5,.45));pointer-events:none}
.info{display:flex;flex-direction:column;justify-content:center;min-width:0}
.school{font-size:clamp(9px,2.2cqw,15px);letter-spacing:.14em;color:var(--gold2)}
.en{font-size:clamp(7px,1.45cqw,10px);letter-spacing:.06em;color:rgba(245,236,210,.7);margin-top:2px}
.rule{height:1px;margin:4cqw 0 3.4cqw;background:linear-gradient(90deg,var(--gold),transparent)}
h1{margin:0;font-weight:700;font-size:clamp(24px,7.2cqw,54px);letter-spacing:.3em;color:var(--gold2);line-height:1}
.dept{margin-top:2.2cqw;font-size:clamp(11px,2.5cqw,18px);letter-spacing:.08em}
.dept span{display:block;font-size:.82em;color:rgba(245,236,210,.8);margin-top:.2em}
ul{list-style:none;margin:4cqw 0 0;padding:0;display:grid;gap:1.6cqw;font-size:clamp(10px,2.3cqw,17px)}
li{display:flex;gap:.8em;align-items:baseline}
li b{font-weight:600;color:var(--gold);min-width:2.2em}
a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
a:hover,a:focus-visible{border-color:var(--gold);outline:none}
@media (max-width:430px){.card{aspect-ratio:auto;grid-template-columns:1fr;padding:30px 24px}.photo{width:46%;justify-self:center}.info{align-items:center;text-align:center}.rule{width:100%}li{justify-content:center;text-align:left}}
.en-name{margin-top:1.6cqw;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(15px,4.2cqw,30px);letter-spacing:.12em;color:var(--ivory)}
li a,li span{overflow-wrap:anywhere}
.cafe{background:#fff}
.cafe img{mix-blend-mode:normal;filter:brightness(1.04) contrast(1.03)}
.cafe::after{display:none}
</style>
</head>
